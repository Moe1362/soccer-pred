name: Update predictions

on:
  schedule:
    # 10:23 and 00:23 UTC = 2:23 AM and 4:23 PM Pacific (standard time)
    - cron: "23 0,10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch matches and rebuild the page
        run: python3 fetch_matches.py --standalone
      - name: Commit updated data
        run: |
          git config user.name "soccer-pred-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.json history.json odds_cache.json
          git diff --cached --quiet || git commit -m "Update predictions $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
